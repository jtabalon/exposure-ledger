[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "exposure-ledger-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "exposure-ledger-domain",
  "exposure-ledger-storage",
  "httpx>=0.28",
  "langgraph>=0.4",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.8",
  "sqlalchemy>=2.0",
]

[tool.uv.sources]
exposure-ledger-domain = { workspace = true }
exposure-ledger-storage = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/exposure_ledger_worker"]
