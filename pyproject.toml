[tool.uv.workspace]
members = ["apps/api", "apps/worker", "packages/domain", "packages/storage"]

[dependency-groups]
dev = [
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.11",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["packages/domain/tests", "packages/storage/tests", "apps/api/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
